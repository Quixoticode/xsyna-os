<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>xSyna Games</title>
    <meta name="description" content="xSyna Games — Browser-Mini-Games im xSyna Design." />
    <link rel="icon" type="image/svg+xml" href="/xyna-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/index.css" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.185.1",
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
    </script>
  </head>
  <body>
    <div id="neural-canvas"></div>

    <header class="navbar">
      <nav class="container navbar-inner">
        <a href="/" class="flex items-center gap-2" aria-label="xSyna Home">
          <svg width="28" height="28" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#22D3EE" />
                <stop offset="100%" stop-color="#FBBF24" />
              </linearGradient>
            </defs>
            <path d="M 20 20 C 50 20, 50 80, 80 80" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
            <path d="M 80 20 C 50 20, 50 80, 20 80" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
            <circle cx="50" cy="50" r="10" fill="#0B1120" stroke="url(#logoGrad)" stroke-width="4" />
            <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
          </svg>
          <span style="font-weight: 700; font-size: 1.1rem;">xSyna</span>
        </a>
        <div style="display: flex; gap: 12px; align-items: center;">
          <a href="/internal-services" class="btn btn-secondary btn-sm">Dashboard</a>
          <a href="/auth" class="btn btn-primary btn-sm">Account</a>
        </div>
      </nav>
    </header>

    <main style="padding-top: 120px; padding-bottom: 96px;">
      <section class="container" style="text-align: center; margin-bottom: 64px;">
        <h1 class="text-liquid" style="font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; margin-bottom: 16px; padding-bottom: 0.1em;">xSyna Games</h1>
        <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto; line-height: 1.6;">
          Fünf schnelle Browser-Mini-Games im Neural-Liquid-Design. Kein Download, keine Werbung — direkt loslegen.
        </p>
      </section>

      <section class="container">
        <div id="games-grid" class="news-grid" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));">
          <div style="text-align: center; padding: 48px 0;">
            <div style="width: 48px; height: 48px; border: 3px solid rgba(34,211,238,0.2); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 24px;"></div>
            <p style="color: var(--text-secondary);">Games werden geladen...</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
        <p style="font-size: 0.85rem; color: var(--text-muted);">&copy; 2026 Jake Ruck — xSyna. Alle Rechte vorbehalten.</p>
        <a href="/" style="font-size: 0.85rem; color: var(--text-secondary);">xSyna Home</a>
      </div>
    </footer>

    <script type="module" src="/src/games.js?v=1"></script>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
