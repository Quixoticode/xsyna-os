<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>xSyna Internal Services</title>
    <link rel="icon" type="image/svg+xml" href="/xyna-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/index.css?v=7" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.185.1",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.110.9"
      }
    }
    </script>
  </head>
  <body>
    <div id="neural-canvas"></div>

    <div id="loading-screen" style="position: fixed; inset: 0; z-index: 101; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;">
      <div style="width: 56px; height: 56px; border: 2px solid rgba(34,211,238,0.2); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px;"></div>
      <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 8px;">xSyna Panel</h1>
      <p id="loading-text" style="color: var(--text-secondary); max-width: 480px;">Initialisierung läuft...</p>
    </div>

    <div id="maintenance-screen" class="hidden" style="position: fixed; inset: 0; z-index: 100; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;">
      <div style="width: 56px; height: 56px; border: 2px solid rgba(34,211,238,0.2); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px;"></div>
      <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 8px;">Wartungsmodus</h1>
      <p id="maintenance-text" style="color: var(--text-secondary); max-width: 480px; margin-bottom: 24px;">Wir arbeiten an xSyna. Bitte hab einen Moment Geduld.</p>
      <div style="width: 100%; max-width: 480px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; margin-bottom: 16px;">
        <div id="maintenance-progress" style="height: 100%; background: linear-gradient(135deg, var(--cyan), var(--amber)); width: 0%; transition: width 0.3s;"></div>
      </div>
      <div id="maintenance-status" style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--cyan);">System wird aktualisiert...</div>
    </div>

    <div id="app" class="hidden" style="min-height: 100vh;">
      <div class="dashboard">
        <aside class="sidebar">
          <div class="sidebar-header">
            <svg width="24" height="24" viewBox="0 0 100 100">
              <defs>
                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#22D3EE" />
                  <stop offset="100%" stop-color="#FBF924" />
                </linearGradient>
              </defs>
              <path d="M 20 20 C 50 20, 50 80, 80 80" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
              <path d="M 80 20 C 50 20, 50 80, 20 80" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
              <circle cx="50" cy="50" r="10" fill="#0B1120" stroke="url(#logoGrad)" stroke-width="4" />
              <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
            </svg>
            <span style="font-weight: 700;">xSyna</span>
          </div>
          <nav id="sidebar-nav" class="sidebar-nav"></nav>
          <div class="sidebar-footer">
            <div id="user-email" style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px;">guest@xsyna.de</div>
            <button id="logout-btn" class="btn btn-primary btn-sm" style="width: 100%;">Abmelden</button>
          </div>
        </aside>

        <div class="main">
          <header class="main-header">
            <h2 id="page-title" style="font-size: 1rem; font-weight: 700;">Dashboard</h2>
            <span id="role-badge" class="role-badge">USER</span>
          </header>
          <main id="page-content" class="main-content"></main>
        </div>
      </div>
    </div>

    <script type="module" src="/src/internal.js?v=10"></script>

    <script>
      // Debug & Fallback: ensure app becomes visible even if JS silently fails
      (function() {
        var start = performance.now();
        console.log('[xSyna] internal-services page parsed at', new Date().toISOString());

        // Force service worker update to clear stale caches
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(registration) {
              registration.update();
              console.log('[xSyna] SW update requested:', registration.scope);
            });
          });
        }

      // Loading screen: hide as soon as the app becomes visible
      var loadingCheck = setInterval(function() {
        var app = document.getElementById('app');
        var loading = document.getElementById('loading-screen');
        if (app && !app.classList.contains('hidden') && loading) {
          loading.style.display = 'none';
          clearInterval(loadingCheck);
        }
      }, 100);

      // Fallback: after 10s, if the module never signalled readiness, show recovery options
      setTimeout(function() {
        if (window.__XSYNA_APP_READY) return;
        console.warn('[xSyna] Fallback: app did not initialize within 10s');
        var app = document.getElementById('app');
        var content = document.getElementById('page-content');
        if (app && content) {
          app.classList.remove('hidden');
          app.style.display = 'flex';
          content.innerHTML = '<div style="padding:24px;text-align:center;">' +
            '<p style="color:#f87171; margin-bottom:12px;">Panel konnte nicht initialisiert werden.</p>' +
            '<p id="init-error-detail" style="color:var(--text-muted);font-size:0.85rem;margin-bottom:16px;">Das JavaScript-Modul hat sich nicht innerhalb von 10 Sekunden gemeldet. Mögliche Ursachen: kein Session-Cookie, Service-Worker-Cache oder Netzwerkfehler.</p>' +
            '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px;">' +
            '<button id="xs-clear-cache" style="padding:10px 20px;background:var(--cyan);color:#000;border:none;border-radius:999px;cursor:pointer;font-weight:600;">Cache leeren &amp; neu laden</button>' +
            '<a href="/auth" style="padding:10px 20px;background:rgba(255,255,255,0.08);color:var(--text);border:1px solid var(--border);border-radius:999px;cursor:pointer;font-weight:600;text-decoration:none;">Zum Login</a>' +
            '</div>' +
            '</div>';
          var loading = document.getElementById('loading-screen');
          if (loading) loading.style.display = 'none';
          var btn = document.getElementById('xs-clear-cache');
          if (btn) {
            btn.addEventListener('click', function() {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  regs.forEach(function(r) { r.unregister(); });
                });
              }
              localStorage.clear();
              window.location.reload(true);
            });
          }
        }
      }, 10000);
      })();
    </script>

    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .hidden { display: none !important; }
      #app { display: flex !important; opacity: 1 !important; visibility: visible !important; }
      #app.hidden { display: none !important; }
      @media (max-width: 768px) {
        .dashboard { flex-direction: column; }
        .sidebar { width: 100%; }
      }
    </style>
    <noscript>
      <div style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #030508; color: #fff; z-index: 9999; padding: 24px; text-align: center;">
        <p>JavaScript ist erforderlich, um das xSyna Panel zu nutzen.</p>
      </div>
    </noscript>
  </body>
</html>
