<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>xSyna Account — Anmelden</title>
    <meta name="description" content="Melde dich bei deinem xSyna Account an." />
    <link rel="icon" type="image/svg+xml" href="/xyna-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/GeistMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: "Geist"; src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: "Geist"; src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
      @font-face { font-family: "Geist"; src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
      @font-face { font-family: "Geist"; src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
      @font-face { font-family: "Geist Mono"; src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/GeistMono-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: "Geist Mono"; src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/GeistMono-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
      @font-face { font-family: "Geist Mono"; src: url("https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/GeistMono-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    </style>
    <link rel="stylesheet" href="/src/index.css?v=8" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.185.1",
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
    </script>
  </head>
  <body>
    <div id="neural-canvas"></div>

    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
      <div style="width: 100%; max-width: 420px;">
        <div class="card" style="padding: 40px;">
          <div style="text-align: center; margin-bottom: 32px;">
            <svg width="40" height="40" viewBox="0 0 100 100" style="margin-bottom: 16px;" data-brand-logo="xsyna">
              <defs>
                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#A3E635" />
                  <stop offset="100%" stop-color="#A3E635" />
                </linearGradient>
              </defs>
              <path d="M 20 20 C 50 20, 50 80, 80 80" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
              <path d="M 80 20 C 50 20, 50 80, 20 80" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
              <circle cx="50" cy="50" r="10" fill="#0A0A0A" stroke="url(#logoGrad)" stroke-width="4" />
              <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
            </svg>
            <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 8px;">xSyna Account</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Melde dich an, um auf Produkte, Support und dein Panel zuzugreifen.</p>
          </div>

          <div id="auth-tabs" style="display: flex; gap: 8px; margin-bottom: 24px; padding: 4px; background: rgba(255,255,255,0.03); border-radius: 8px;">
            <button data-tab="login" class="auth-tab active" style="flex: 1; padding: 8px; border-radius: 6px; border: none; background: transparent; color: var(--text); cursor: pointer; font-size: 0.85rem; font-weight: 600;">Anmelden</button>
            <button data-tab="register" class="auth-tab" style="flex: 1; padding: 8px; border-radius: 6px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 0.85rem; font-weight: 600;">Registrieren</button>
          </div>

          <form id="login-form" class="form-group">
            <div class="form-group">
              <label class="form-label">E-Mail</label>
              <input type="email" id="email" class="input" placeholder="du@xsyna.de" required />
            </div>
            <div class="form-group">
              <label class="form-label">Passwort <span style="color: var(--text-muted); font-size: 0.75rem;">(optional – für Magic-Link leer lassen)</span></label>
              <input type="password" id="password" class="input" placeholder="••••••••" />
            </div>
            <button type="submit" id="login-button" class="btn btn-primary" style="width: 100%;">Anmelden / Magic-Link senden</button>
          </form>

          <form id="register-form" class="form-group" style="display: none;">
            <div class="form-group">
              <label class="form-label">E-Mail</label>
              <input type="email" id="register-email" class="input" placeholder="du@xsyna.de" required />
            </div>
            <div class="form-group">
              <label class="form-label">Passwort</label>
              <input type="password" id="register-password" class="input" placeholder="••••••••" required />
            </div>
            <button type="submit" id="register-button" class="btn btn-primary" style="width: 100%;">Konto erstellen</button>
          </form>

          <div style="position: relative; margin: 24px 0; text-align: center;">
            <div style="position: absolute; inset: 0; display: flex; align-items: center;"><span style="width: 100%; border-top: 1px solid var(--border);"></span></div>
            <span style="position: relative; background: var(--bg-card); padding: 0 12px; font-size: 0.75rem; color: var(--text-muted);">oder</span>
          </div>

          <button id="passkey-btn" type="button" class="btn btn-secondary" style="width: 100%;">Mit Passkey anmelden</button>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px;">
            <button id="google-sso-btn" type="button" class="btn btn-secondary" style="padding: 8px 4px; font-size: 0.75rem;">Google</button>
            <button id="apple-sso-btn" type="button" class="btn btn-secondary" style="padding: 8px 4px; font-size: 0.75rem;">Apple</button>
            <button id="github-sso-btn" type="button" class="btn btn-secondary" style="padding: 8px 4px; font-size: 0.75rem;">GitHub</button>
          </div>
          <div id="auth-message" style="display: none; margin-top: 16px; text-align: center; font-size: 0.85rem;"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/auth.js?v=5"></script>
  </body>
</html>
