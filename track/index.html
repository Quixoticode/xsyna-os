<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xSyna Tracking</title>
    <meta name="description" content="Verfolge den Status deines xSyna Auftrags." />
    <link rel="icon" type="image/svg+xml" href="/xyna-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/index.css" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.185.1",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.110.9"
      }
    }
    </script>
  </head>
  <body>
    <div id="neural-canvas"></div>

    <header class="navbar">
      <nav class="container navbar-inner">
        <a href="/" class="flex items-center gap-2" aria-label="xSyna Home">
          <svg width="28" height="28" viewBox="0 0 100 100">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#22D3EE" />
                <stop offset="100%" stop-color="#FBBF24" />
              </linearGradient>
            </defs>
            <path d="M 20 20 C 50 20, 50 80, 80 80" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
            <path d="M 80 20 C 50 20, 50 80, 20 80" stroke="url(#logoGrad)" stroke-width="8" stroke-linecap="round" fill="none" />
            <circle cx="50" cy="50" r="10" fill="#0B1120" stroke="url(#logoGrad)" stroke-width="4" />
            <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
          </svg>
          <span style="font-weight: 700; font-size: 1.1rem;">xSyna</span>
        </a>
        <a href="/" class="btn btn-secondary btn-sm">Zurück zur Startseite</a>
      </nav>
    </header>

    <main style="padding-top: 120px; padding-bottom: 96px;">
      <div class="container" style="max-width: 800px;">
        <div id="track-container" class="reveal">
          <div class="card" style="text-align: center; padding: 64px 24px;">
            <div style="width: 48px; height: 48px; border: 3px solid rgba(34,211,238,0.2); border-top-color: var(--cyan); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 24px;"></div>
            <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 8px;">Tracking-Link wird verarbeitet...</h2>
            <p style="color: var(--text-secondary);">Bitte einen Moment Geduld.</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
        <p style="font-size: 0.85rem; color: var(--text-muted);">&copy; 2026 Jake Ruck — xSyna. Alle Rechte vorbehalten.</p>
        <a href="/" style="font-size: 0.85rem; color: var(--text-secondary);">xSyna Home</a>
      </div>
    </footer>

    <script type="module" src="/src/track.js"></script>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
